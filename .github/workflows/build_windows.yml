name: Build Windows

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install yoga CLI
        shell: bash
        # The same yoga version go.mod builds the app with.
        run: go install github.com/mirzakhany/yoga/cmd/yoga@$(go list -m -f '{{.Version}}' github.com/mirzakhany/yoga)

      # amd64 only: the prebuilt wgpu-native has no windows/386 library, and
      # its windows/arm64 one needs the MSVC C++ runtime, which cgo's MinGW
      # toolchain cannot link. Windows on ARM runs the amd64 build emulated.
      - name: Build windows amd64
        shell: bash
        run: yoga package -os windows -arch amd64 -version ${{ github.event.release.tag_name }}

      - name: Upload Release Asset
        run: |
          gh release upload ${{ github.event.release.tag_name }} ./dist/windows/chapar-windows-${{ github.event.release.tag_name }}-amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
